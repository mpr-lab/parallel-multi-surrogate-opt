# Default settings shared across all experiments.
# Benchmark-specific configs (branin.yaml, hartmann.yaml, etc.) may override
# any of these values.

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed: 42          # master random seed — override via CLI: --seed 123

# ─── What are we running? ────────────────────────────────────────────────────
method:    "parallel_msbo"   # name used in output filenames and logs
benchmark: "branin"           # one of: branin, hartmann6, rastrigin, xgboost

# ─── Optimization budget ─────────────────────────────────────────────────────
n_initial: 10     # random evaluations before any surrogate is trained
n_rounds:  20     # BO rounds after the warm start

# ─── Candidate allocation per round ──────────────────────────────────────────
# fast_worker_budget + slow_worker_budget = total candidates per round
fast_worker_budget: 6   # candidates proposed by the RF (fast surrogate)
slow_worker_budget: 2   # candidates proposed by the GP (slow surrogate)

# ─── Cost-aware GP refresh ───────────────────────────────────────────────────
# This is the core idea: only retrain the GP every K rounds.
#   gp_refresh_every: 1  → retrain every round (baseline, most expensive)
#   gp_refresh_every: 5  → retrain rounds 0, 5, 10, ... (default, amortized)
#   gp_refresh_every: 10 → retrain every 10 rounds (very cheap, more staleness)
gp_refresh_every: 5

# Whether to include the GP at all (set false for RF-only baseline)
use_gp: true

# ─── Acquisition function ────────────────────────────────────────────────────
n_random_candidates: 1000   # pool size scored by Expected Improvement

# ─── Parallel evaluation ─────────────────────────────────────────────────────
n_eval_workers: 4
# use_parallel: false  is safer for cheap synthetic benchmarks.
# The pool overhead (~50ms per worker) dwarfs microsecond synthetic evaluations.
# Set to true only when objective evaluations take >> 1 second (e.g., XGBoost).
use_parallel: false

# Whether the objective function accepts a 'seed' keyword argument.
# True for stochastic objectives (XGBoost cross-validation).
# False for deterministic synthetics (Branin, Hartmann, Rastrigin).
pass_seed_to_objective: false

# ─── Output ──────────────────────────────────────────────────────────────────
output_dir: "results"
