# XGBoost hyperparameter tuning on the breast cancer dataset.
#
# The objective is mean 3-fold cross-validated AUC-ROC (higher = better).
# Hyperparameters: learning_rate, max_depth, n_estimators, subsample.
#
# This is a stochastic objective (cross-validation involves a random split),
# so pass_seed_to_objective: true is required for reproducibility.
# Each candidate evaluation uses a unique worker seed derived from:
#   derive_worker_seed(base_seed, round_id, candidate_id)

seed:      42
method:    "parallel_msbo"
benchmark: "xgboost"

n_initial: 8
n_rounds:  20

fast_worker_budget: 6
slow_worker_budget: 2
gp_refresh_every:   5
use_gp:             true

n_random_candidates: 500

# XGBoost evaluation takes ~1-5 seconds — parallel evaluation is worth it
n_eval_workers: 4
use_parallel:   true

# IMPORTANT: must be true for XGBoost (seeds the CV splits and model)
pass_seed_to_objective: true

output_dir: "results/xgboost"
