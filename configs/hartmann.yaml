# Hartmann 6D benchmark — 6-dimensional, harder than Branin.
#
# Global minimum ≈ -3.32237 at approx (0.201, 0.150, 0.477, 0.275, 0.312, 0.657).
# We negate so the optimizer maximizes; best found ≈ +3.32237.
#
# Note: the config key is 'hartmann6' (not 'hartmann') to match the
# benchmark registry in src/objectives/synthetic.py.

seed:      42
method:    "parallel_msbo"
benchmark: "hartmann6"

n_initial: 20      # more initial points for a harder 6D space
n_rounds:  30

fast_worker_budget: 6
slow_worker_budget: 2
gp_refresh_every:   5
use_gp:             true

n_random_candidates: 2000   # larger pool for a 6D space

n_eval_workers: 1
use_parallel:   false
pass_seed_to_objective: false

output_dir: "results/hartmann6"
