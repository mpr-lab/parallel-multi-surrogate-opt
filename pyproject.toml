[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "parallel-msbo"
version     = "0.1.0"
description = "Parallel Multi-Surrogate Optimization with Cost-Aware GP Refresh"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "xgboost>=2.0",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]
